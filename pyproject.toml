[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aigate"
version = "0.1.0"
description = "AI-Aware Network Security Gateway"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "joblib==1.6.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "PyYAML==6.0.3",
    "scikit-learn==1.9.1",
    "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "setuptools==84.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aigate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
